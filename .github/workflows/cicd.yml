name: Deploy React Frontend

on:
 push:
  branches:
   - Development

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout Source
      uses: actions/checkout@v4
    - name: Login to docker hub
      run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
    - name: Cleanup unused build images
      run: docker image prune -f --filter "until=1h"
    - name: Build Docker Image
      run: docker build -t charitha124/react-js .
    - name: Publish Image to docker hub
      run: docker push charitha124/react-js:latest


 deploy:
  needs: build
  runs-on: self-hosted
  steps:
   - name: Clean up unused Docker objects
     run: docker system prune -f --all --volumes
   - name: Login to docker hub
     run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
   - name: Pull image from docker hub
     run: docker pull charitha124/react-js:latest
   - name: Run Docker Container
     run: |
      docker rm -f react-js-container || true
      sudo docker run -d \
      --restart on-failure:3 \
      -p 80:80 \
      --name react-js-container \
      -e VITE_REACT_APP_API_URL=${{ secrets.VITE_REACT_APP_API_URL }} \
      charitha124/react-js:latest \
      npm run dev

   - name: Clean up after deployment
     run: |
      docker image prune -f
      docker builder prune -f